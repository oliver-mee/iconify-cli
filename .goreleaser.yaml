version: 2
project_name: iconify-pp-cli
changelog:
  disable: true
builds:
  - id: iconify-pp-cli
    main: ./cmd/iconify-pp-cli
    binary: iconify-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/oliver-mee/iconify-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: iconify-pp-mcp
    main: ./cmd/iconify-pp-mcp
    binary: iconify-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: iconify-pp-cli
    repository:
      owner: oliver-mee
      name: homebrew-tap
    homepage: "https://github.com/oliver-mee/iconify-pp-cli"
    description: "Every Iconify icon from one Go binary, plus a local index that answers set-coverage, migration, and audit questions no icon tool answers today."
    install: |
      bin.install "iconify-pp-cli"
      bin.install "iconify-pp-mcp"
